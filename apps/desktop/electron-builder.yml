appId: com.conflux.desktop
productName: Conflux
copyright: Copyright (c) 2026 Conflux contributors

directories:
  app: ../..
  output: ../../release
  buildResources: build

extraMetadata:
  main: apps/desktop/src/main.cjs

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

files:
  - apps/desktop/**/*
  - apps/server/dist/**/*
  - apps/server/skills/**/*
  - apps/web/dist/**/*

asar: true
asarUnpack:
  - "**/better-sqlite3/**"
npmRebuild: true

publish:
  provider: github
  owner: yudongyouqing
  repo: Conflux
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - dir
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - dir
