name: CI

on:
  push:
    branches: [main, dev]
  # Any PR base: stacked PRs target feature branches, and test/chore/ci
  # branch pushes would otherwise never run checks at all.
  pull_request:

jobs:
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      # server tests now make runtime (non type-only) imports from
      # @conflux/shared, so the dist output must exist before they run.
      - run: npm run build -w packages/shared
      - run: npm test -w apps/server
      # Process-level E2E runs serially after the suite: the production
      # inspection timeout (2 s) is exceeded when many suites load the
      # machine at once, which the parallel *.test.ts glob would do.
      - run: npm run test:process-e2e -w apps/server

  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:desktop

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w apps/web

  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:web
      - uses: actions/upload-artifact@v7
        with:
          name: browser-performance
          path: test-results/performance/browser.json
          if-no-files-found: error

  server-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:perf:server
      - run: npm run perf:server
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-database-performance
          path: test-results/performance/server-database.json
          if-no-files-found: error

  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
      # serial after web-smoke: both drive real servers on adjacent ports
      - run: npm run test:e2e:chat-first
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chat-first-evidence
          path: |
            test-results/e2e/chat-first
            test-results/e2e
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node --test scripts/release-config.test.cjs scripts/packaged-module-smoke.test.cjs
      - run: npm run check:tokens
