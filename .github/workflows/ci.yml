name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure npm diagnostics
        run: npm config set logs-dir "${{ runner.temp }}/npm-logs"

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test -w apps/server

      - name: Build shared, server, and web packages
        run: npm run build

      - name: Run desktop module tests
        run: npm run test:desktop

      - name: Scan source for credentials
        run: npm run check:secrets

      - name: Preserve npm diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-logs
          if-no-files-found: ignore
