name: Release

on:
  push:
    tags:
      - "v*"
  # Manual verification runs: builds every platform and module-smokes the
  # packaged tree; the publish job below is skipped because it only runs
  # for real tags.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  desktop:
    name: Build ${{ matrix.platform }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            flag: win
            target: nsis
          - os: macos-latest
            platform: macOS
            flag: mac
            target: dmg
          - os: ubuntu-latest
            platform: Linux
            flag: linux
            target: AppImage

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$expected'."
          }

      - name: Scan source for credentials
        run: npm run check:secrets

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run server tests
        run: npm test -w apps/server

      - name: Build application resources
        run: npm run build

      - name: Run desktop module tests
        run: npm run test:desktop

      - name: Test packaged-module smoke lifecycle
        run: node --test scripts/packaged-module-smoke.test.cjs

      - name: Build Windows release
        if: matrix.platform == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --projectDir apps/desktop --config electron-builder.yml --${{ matrix.flag }} ${{ matrix.target }} --publish never

      # Module-load smoke against the PACKAGED tree: the desktop main
      # crashed on a missing node-pty in v0.3.0 while the server healthz
      # stayed green — health alone never proves the installer is complete.
      - name: Smoke-test packaged modules (Windows)
        timeout-minutes: 2
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $exe = "release/win-unpacked/Conflux.exe"
          $asar = "release/win-unpacked/resources/app.asar"
          if (-not (Test-Path $exe) -or -not (Test-Path $asar)) { throw "packaged output missing: $exe / $asar" }
          $env:ELECTRON_RUN_AS_NODE = "1"
          & $exe scripts/packaged-module-smoke.cjs (Resolve-Path $asar).Path
          if ($LASTEXITCODE -ne 0) { throw "Packaged module smoke failed ($LASTEXITCODE)" }

      - name: Build macOS release
        if: matrix.platform == 'macOS'
        env:
          MAC_SIGN_CERT: ${{ secrets.MAC_CSC_LINK }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MAC_SIGN_CERT" ]]; then
            if [[ -z "$MAC_SIGN_PASSWORD" ]]; then
              echo "MAC_CSC_KEY_PASSWORD is required when MAC_CSC_LINK is set" >&2
              exit 1
            fi
            export CSC_LINK="$MAC_SIGN_CERT" CSC_KEY_PASSWORD="$MAC_SIGN_PASSWORD"
          elif [[ -n "$MAC_SIGN_PASSWORD" ]]; then
            echo "MAC_CSC_LINK is required when MAC_CSC_KEY_PASSWORD is set" >&2
            exit 1
          fi
          npx electron-builder --projectDir apps/desktop --config electron-builder.yml --mac dmg zip --publish never

      - name: Build Linux release
        if: matrix.platform == 'Linux'
        run: npx electron-builder --projectDir apps/desktop --config electron-builder.yml --${{ matrix.flag }} ${{ matrix.target }} --publish never

      - name: Smoke-test packaged modules (Linux)
        timeout-minutes: 2
        if: matrix.platform == 'Linux'
        run: |
          executable_name=$(node -p "require('./package.json').name.toLowerCase()")
          exe="release/linux-unpacked/$executable_name"
          asar="release/linux-unpacked/resources/app.asar"
          test -x "$exe" || { echo "missing $exe"; exit 1; }
          test -f "$asar" || { echo "missing $asar"; exit 1; }
          ELECTRON_RUN_AS_NODE=1 "$exe" scripts/packaged-module-smoke.cjs "$(pwd)/$asar"

      - name: Smoke-test packaged modules (macOS)
        timeout-minutes: 2
        if: matrix.platform == 'macOS'
        run: |
          apps=(release/mac*/Conflux.app)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]] || { echo "expected exactly one packaged macOS app"; exit 1; }
          exe="${apps[0]}/Contents/MacOS/Conflux"
          asar="${apps[0]}/Contents/Resources/app.asar"
          test -x "$exe" || { echo "missing $exe"; exit 1; }
          test -f "$asar" || { echo "missing $asar"; exit 1; }
          ELECTRON_RUN_AS_NODE=1 "$exe" scripts/packaged-module-smoke.cjs "$(pwd)/$asar"

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: conflux-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: conflux-*-${{ github.run_id }}
          path: release
          merge-multiple: true

      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
